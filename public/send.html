<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Request</title>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #ffffff;
        --panel-2: #f8f9fb;
        --head: #f3f5f7;
        --line: #d9dee5;
        --text: #1f2328;
        --muted: #5f6b7a;
        --accent: #1a73e8;
        --ok: #0b8043;
        --warn: #b06000;
        --bad: #c5221f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Consolas, "Liberation Mono", Menlo, Courier, monospace;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
      }
      .app {
        display: grid;
        grid-template-rows: auto 1fr 320px;
        height: 100vh;
      }
      .topbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        background: linear-gradient(to bottom, #f9fafb, #f1f3f4);
        border-bottom: 1px solid var(--line);
      }
      .title {
        font-size: 13px;
        color: #202124;
        margin: 0;
        padding-right: 12px;
      }
      .btn {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        padding: 5px 8px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn:hover {
        border-color: #c2c9d3;
        background: #f6f8fa;
      }
      .meta {
        font-size: 11px;
        color: var(--muted);
      }
      .editor {
        display: grid;
        grid-template-rows: auto auto 1fr 1fr;
        gap: 8px;
        padding: 10px;
        overflow: auto;
        background: var(--panel);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .field {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 12px;
        width: 100%;
      }
      .method {
        width: 110px;
      }
      textarea.field {
        resize: vertical;
        min-height: 140px;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
      }
      .detail {
        border-top: 1px solid var(--line);
        background: var(--panel-2);
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        padding: 4px 6px;
        background: #f3f5f7;
      }
      .tab {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        padding: 6px 8px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      .tab.active {
        color: var(--text);
        border-color: #cbd2dc;
        background: #ffffff;
      }
      .tab-body {
        padding: 10px;
        overflow: auto;
      }
      pre {
        margin: 0;
        border: 1px solid var(--line);
        background: #ffffff;
        border-radius: 4px;
        color: #202124;
        padding: 8px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .kvline {
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .kvline b {
        color: var(--text);
      }
      .status-ok {
        color: var(--ok);
      }
      .status-bad {
        color: var(--bad);
      }
      .status-warn {
        color: var(--warn);
      }
      @media (max-width: 980px) {
        .app {
          grid-template-rows: auto 1fr 40%;
        }
        .row {
          flex-direction: column;
          align-items: stretch;
        }
        .method {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1 class="title">Send Request</h1>
        <button class="btn" id="sendBtn">Send</button>
        <button class="btn" id="clearBtn">Clear</button>
        <span class="meta" id="meta">Ready</span>
      </div>
      <div class="editor">
        <div class="row">
          <select id="targetSelect" class="field method"></select>
          <select id="method" class="field method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
            <option>HEAD</option>
            <option>OPTIONS</option>
          </select>
          <input id="url" class="field" placeholder="https://example.com/api" />
        </div>
        <div class="row">
          <div class="label">Headers</div>
        </div>
        <textarea id="headersText" class="field" placeholder="Content-Type: application/json&#10;Authorization: Bearer ..."></textarea>
        <textarea id="bodyText" class="field" placeholder='{"hello":"world"}'></textarea>
      </div>
      <div class="detail">
        <div class="tabs">
          <button class="tab active" data-tab="summary">Summary</button>
          <button class="tab" data-tab="headers">Headers</button>
          <button class="tab" data-tab="response">Response</button>
          <button class="tab" data-tab="meta">Meta</button>
        </div>
        <div class="tab-body" id="detail">Send a request to see the response.</div>
      </div>
    </div>
    <script src="/send.js"></script>
  </body>
</html>
